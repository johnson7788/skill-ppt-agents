<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>AI 改写</title>
  <!-- ONLYOFFICE 插件加载器：官方示例均用此 CDN。ponytail: 离线环境需把 v1/ 目录自托管进容器再改成相对路径 -->
  <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; font-size: 13px; color: #334155; margin: 0; padding: 12px; }
    .label { color: #64748b; font-size: 12px; margin: 8px 0 4px; }
    #sel { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px; max-height: 96px; overflow: auto; white-space: pre-wrap; }
    #inst { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px; resize: vertical; min-height: 56px; font: inherit; }
    #go { margin-top: 8px; width: 100%; padding: 8px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #go:disabled { background: #94a3b8; cursor: default; }
    #status { color: #64748b; font-size: 12px; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>
  <div class="label">选中的文本（可选）</div>
  <div id="sel">（未选中，可做整篇/整页操作）</div>
  <div class="label">编辑指令</div>
  <textarea id="inst" placeholder="选中文字：改得更正式 / 缩短一半&#10;不选：把第一页背景改成浅黄色 / 把全文的旧词替换成新词"></textarea>
  <button id="go">执行</button>
  <div id="status"></div>
  <script type="text/javascript" src="code.js"></script>
</body>
</html>
